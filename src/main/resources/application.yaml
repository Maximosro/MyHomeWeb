
spring:
  application:
    name: MyHomeWeb

  datasource:
    url: jdbc:sqlite:data/myhomeweb.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  thymeleaf:
    cache: false

server:
  port: 8080